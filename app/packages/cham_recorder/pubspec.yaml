name: cham_recorder
description: Ghi màn hình cho Chạm (Android MediaProjection, iOS ReplayKit). CHƯA THỬ TRÊN MÁY THẬT.
version: 0.1.0
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: vn.cham.recorder
        pluginClass: ChamRecorderPlugin
      ios:
        pluginClass: ChamRecorderPlugin
