name: cham_beauty
description: Làm mịn da (Android + iOS) cho camera cuộc gọi Chạm, qua bộ xử lý khung hình của flutter_webrtc. CHƯA THỬ TRÊN MÁY THẬT.
version: 0.1.0
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: vn.cham.beauty
        pluginClass: ChamBeautyPlugin
      ios:
        pluginClass: ChamBeautyPlugin
