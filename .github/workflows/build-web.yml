name: Build Web (lien ket dien thoai)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['app/lib/main_web.dart', 'app/lib/link/**', 'app/lib/services/link_*.dart', '.github/workflows/build-web.yml']

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tao thu muc web + pub get
        working-directory: app
        run: |
          flutter create --platforms=web --project-name cham . 2>&1 | tail -5
          flutter pub get 2>&1 | tail -5

      - name: Build web
        working-directory: app
        run: |
          set -o pipefail
          flutter build web -t lib/main_web.dart --release --base-href /web/ --no-web-resources-cdn 2>&1 | tee ../build-web-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cham-web
          path: app/build/web

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-web-logs
          path: build-web-log.txt
          if-no-files-found: ignore
